name: Live Jev

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-jev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-contracts:
    name: Real API contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: live
    env:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.7.21"
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Require TypeSafe API key
        run: test -n "$TYPESAFE_API_KEY"

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Run every demo against Jev
        run: uv run pytest --live
